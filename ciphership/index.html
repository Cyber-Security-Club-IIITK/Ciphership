
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHERSHIP | CSY x Coders' Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan-glow: rgba(0, 229, 255, 0.4);
            --emerald-glow: rgba(0, 200, 83, 0.4);
            --red-glow: rgba(255, 23, 68, 0.4);
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .cell-glow-cyan { box-shadow: 0 0 15px var(--cyan-glow); }
        .cell-glow-green { box-shadow: 0 0 15px var(--emerald-glow); }
        .cell-glow-red { box-shadow: 0 0 15px var(--red-glow); }
        
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
        }
        .scanline-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 229, 255, 0.03);
            opacity: 0.1;
            animation: scanline 10s linear infinite;
        }

        .terminal-glow {
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
        }

        .grid-bg {
            background-image: radial-gradient(circle at 1px 1px, rgba(0, 229, 255, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.36.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="grid-bg">
    <div class="scanline-container"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
